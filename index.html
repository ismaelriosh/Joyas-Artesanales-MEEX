<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEEX TikTok Shop | Lujo Artesanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
 
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-card: #1a1a1a;
      --text-main: #fafafa;
      --text-secondary: #9a9a9a;
      --accent: #c9a961;
      --accent-light: #e8d4b0;
      --accent-dark: #8b7355;
      --stone: #d4d0c8;
      --bronze: #a89968;
      --border-color: #2a2824;
      --font-serif: 'Montserrat', sans-serif;
      --font-sans: 'Montserrat', sans-serif;
      --ease-luxury: cubic-bezier(0.6, 0.05, 0.01, 0.99);
      --ease-smooth: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 200;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      letter-spacing: -0.03em;
    }

    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.3rem;
      transition: transform 0.3s var(--ease-smooth);
    }
    .cart-icon:hover { transform: scale(1.1) rotate(5deg); }

    .cart-badge {
      position: absolute;
      top: -8px; right: -8px;
      background: var(--accent);
      color: #0f0f0f;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* HERO */
    .hero {
      margin-top: 70px;
      height: 60vh;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      transform: scale(1.02);
      filter: brightness(1.05) contrast(1.1) saturate(1.15);
      will-change: transform;
      display: block;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,10,10,0.15) 0%, rgba(10,10,10,0.5) 60%, rgba(10,10,10,0.92) 100%);
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .hero-logo-text {
      font-family: var(--font-serif);
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 100;
      letter-spacing: 0.15em;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, var(--accent-light) 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      text-transform: uppercase;
      animation: heroFadeIn 1.8s var(--ease-luxury) forwards;
      opacity: 0;
    }

    .hero-tagline {
      font-size: clamp(0.7rem, 2vw, 0.95rem);
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-weight: 200;
      animation: heroFadeIn 1.8s var(--ease-luxury) 0.3s forwards;
      opacity: 0;
    }

    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #0f0f0f;
      border: none;
      padding: 18px 50px;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 50px;
      transition: all 0.4s var(--ease-smooth);
      box-shadow: 0 10px 40px rgba(201, 169, 97, 0.3);
      font-family: var(--font-sans);
      animation: heroFadeIn 1.8s var(--ease-luxury) 0.6s forwards;
      opacity: 0;
    }
    .hero-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(201, 169, 97, 0.5);
    }

    /* CAROUSEL SECTION */
    .carousel-section { padding: 80px 20px; max-width: 100%; }

    .section-title { text-align: center; margin-bottom: 60px; }
    .section-title h2 {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 200;
      margin-bottom: 15px;
      color: var(--text-main);
      letter-spacing: -0.02em;
      position: relative;
      display: inline-block;
    }
    .section-title h2::after {
      content: '';
      position: absolute;
      bottom: -10px; left: 0;
      width: 40px; height: 2px;
      background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      opacity: 0.6;
    }
    .section-title p {
      color: var(--text-secondary);
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 200;
      opacity: 0.7;
      margin-top: 20px;
    }

    .carousel-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      height: 700px;
      perspective: 1000px;
    }
    .carousel-track { position: relative; width: 100%; height: 100%; }

    .product-card {
      position: absolute;
      width: 100%; height: 100%;
      top: 0; left: 0;
      opacity: 0;
      transform: translateX(100%) rotateY(45deg) scale(0.95);
      transition: all 0.9s var(--ease-luxury);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .product-card.active {
      opacity: 1;
      transform: translateX(0) rotateY(0) scale(1);
      pointer-events: auto;
      z-index: 10;
    }
    .product-card.prev {
      opacity: 0;
      transform: translateX(-100%) rotateY(-45deg) scale(0.95);
      z-index: 5;
    }

    .product-image-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      background: linear-gradient(135deg, #1c1c1c 0%, #0d0d0d 100%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1.2;
    }
    .product-image-wrapper img {
      width: 90%; height: 90%;
      object-fit: contain;
      object-position: center;
      border-radius: 20px;
      transition: transform 0.8s var(--ease-luxury), filter 0.8s ease;
      display: block;
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.7));
    }
    .product-card.active .product-image-wrapper img {
      animation: imageZoomPremium 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes imageZoomPremium {
      from { transform: scale(0.9) translateY(10px); filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.5)); }
      to { transform: scale(1) translateY(0); filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.8)); }
    }

    .stock-badge {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(15px);
      color: var(--accent-light);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1.5px solid var(--accent-light);
      z-index: 20;
    }
    .stock-badge.low { color: var(--accent); border-color: var(--accent); }
    .stock-badge.out { color: #666; border-color: #666; }

    .product-info { display: flex; flex-direction: column; gap: 20px; }
    .product-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .product-name { flex: 1; }
    .product-name h3 {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 300;
      margin-bottom: 12px;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--text-main);
      transition: color 0.3s var(--ease-smooth);
    }
    .product-card:hover .product-name h3 { color: var(--accent-light); }
    .product-desc {
      color: var(--text-secondary);
      font-size: clamp(0.75rem, 1.8vw, 0.95rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 200;
      opacity: 0.8;
    }

    .price-tag {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 200;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      margin: 15px 0 20px 0;
      display: inline-block;
    }

    .features { display: flex; gap: 15px; flex-wrap: wrap; }
    .feature {
      background: rgba(201, 169, 97, 0.08);
      border: 1px solid rgba(201, 169, 97, 0.3);
      padding: 10px 14px;
      border-radius: 20px;
      font-size: clamp(0.65rem, 1.5vw, 0.85rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-light);
      transition: all 0.3s var(--ease-smooth);
      font-weight: 300;
    }
    .feature:hover { background: rgba(201, 169, 97, 0.15); transform: translateY(-2px); }

    .product-actions { display: flex; gap: 12px; margin-top: 10px; }
    .btn-add-cart {
      flex: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #0f0f0f;
      border: none;
      padding: 18px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s var(--ease-smooth);
      font-size: clamp(0.85rem, 2vw, 1rem);
      box-shadow: 0 5px 20px rgba(201, 169, 97, 0.3);
      font-family: var(--font-sans);
    }
    .btn-add-cart:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201, 169, 97, 0.5); }
    .btn-add-cart:active { transform: scale(0.98); }

    .btn-wishlist {
      background: rgba(201, 169, 97, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      width: 50px; height: 50px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s var(--ease-smooth);
      display: flex; align-items: center; justify-content: center;
    }
    .btn-wishlist:hover { background: rgba(201, 169, 97, 0.2); transform: scale(1.1); }
    .btn-wishlist.saved { background: var(--accent); color: #0f0f0f; }

    .carousel-controls { display: flex; justify-content: center; gap: 15px; margin-top: 40px; align-items: center; }
    .nav-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s var(--ease-smooth);
      font-weight: 300;
    }
    .nav-btn:hover { border-color: var(--accent); background: rgba(201, 169, 97, 0.1); transform: scale(1.05); }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border-color);
      cursor: pointer;
      transition: all 0.3s var(--ease-smooth);
    }
    .dot.active { background: var(--accent); transform: scale(1.3); }

    /* CART DRAWER */
    .cart-drawer {
      position: fixed;
      right: -100%; top: 0;
      width: 100%; max-width: 450px;
      height: 100vh;
      background: linear-gradient(180deg, var(--bg-card) 0%, #1f1f1f 100%);
      border-left: 1px solid var(--border-color);
      z-index: 2000;
      transition: right 0.5s var(--ease-luxury);
      display: flex; flex-direction: column;
      padding: 30px 25px;
      overflow-y: auto;
    }
    .cart-drawer.open { right: 0; }
    .cart-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .cart-header h2 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 5vw, 2.2rem);
      font-weight: 300; letter-spacing: -0.02em;
    }
    .close-btn {
      background: none; border: none;
      color: var(--text-main); font-size: 1.5rem;
      cursor: pointer; transition: all 0.3s var(--ease-smooth);
      opacity: 0.7;
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
    }
    .close-btn:hover { background: rgba(201, 169, 97, 0.1); opacity: 1; transform: rotate(90deg); }
    .cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; }
    .cart-item {
      display: flex; gap: 15px; padding: 15px;
      background: rgba(201, 169, 97, 0.05);
      border-radius: 12px; margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }
    .cart-item-img {
      width: 80px; height: 100px;
      border-radius: 8px;
      object-fit: contain; object-position: center;
      background: rgba(201, 169, 97, 0.08);
      padding: 8px;
    }
    .cart-item-info { flex: 1; display: flex; flex-direction: column; }
    .cart-item-name { font-weight: 400; margin-bottom: 5px; font-family: var(--font-sans); }
    .cart-item-price {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1rem; font-weight: 300; margin-bottom: 10px;
    }
    .remove-item {
      background: none; border: none;
      color: var(--text-secondary); cursor: pointer;
      font-size: 0.75rem; letter-spacing: 0.1em;
      text-transform: uppercase; align-self: flex-start;
      font-weight: 300; transition: color 0.3s var(--ease-smooth);
    }
    .remove-item:hover { color: var(--accent); }
    .cart-footer { border-top: 1px solid var(--border-color); padding-top: 20px; }
    .cart-total {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; padding: 20px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .cart-total span:first-child {
      font-size: 0.95rem; font-weight: 300;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--text-secondary);
    }
    .cart-total span:last-child {
      font-size: 1.8rem; font-weight: 200;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #0f0f0f; border: none; padding: 18px;
      font-weight: 300; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 12px; transition: all 0.3s var(--ease-smooth);
      margin-bottom: 12px; font-family: var(--font-sans); font-size: 0.95rem;
    }
    .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(201, 169, 97, 0.5); }
    .whatsapp-btn {
      width: 100%; background: #25D366; color: #fff;
      border: none; padding: 16px;
      font-weight: 300; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer;
      border-radius: 12px; transition: all 0.3s var(--ease-smooth);
      font-family: var(--font-sans);
    }
    .whatsapp-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4); }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1500; opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-smooth);
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    .toast {
      position: fixed; bottom: 30px; right: 30px;
      background: rgba(0, 0, 0, 0.9);
      color: var(--accent);
      padding: 16px 24px; border-radius: 50px;
      border: 1px solid var(--accent);
      font-size: 0.85rem; font-weight: 400;
      z-index: 5000;
      animation: slideUp 0.4s var(--ease-smooth) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast.hide { animation: slideDown 0.4s var(--ease-smooth) forwards; }
    @keyframes slideDown {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(100px); opacity: 0; }
    }

    @media (max-width: 768px) {
      nav { padding: 0 15px; }
      .logo { font-size: 1.5rem; }
      .carousel-container { max-width: 100%; padding: 0 15px; }
      .carousel-section { padding: 60px 0; }
      .section-title h2 { font-size: 2rem; }
      .product-card { padding: 0 15px; }
    }
    @media (max-width: 480px) {
      .section-title h2 { font-size: 1.8rem; }
      .price-tag { font-size: 1.8rem; }
      .product-name h3 { font-size: 1.4rem; }
      .hero-logo-text { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">MEEX</div>
    <div class="cart-icon" onclick="toggleCart()">
      &#128717;
      <span class="cart-badge" id="cart-badge">0</span>
    </div>

        desc: "Plata Ley .925 \u00b7 Gema Preciosa Refinada",
        features: ["Rareza Natural", "Brillo \u00danico", "Pieza Magistral"],
        stock: 5
      }
    ];

    let currentIndex = 0;
    let cart = [];

    function initCarousel() {
      const track = document.getElementById('carousel-track');
      track.innerHTML = products.map((product, idx) => `
        <div class="product-card ${idx === 0 ? 'active' : ''}" data-index="${idx}">
          <div class="product-image-wrapper">
            <img src="${product.image}" alt="${product.name}" decoding="async" loading="${idx === 0 ? 'eager' : 'lazy'}">
            <div class="stock-badge ${product.stock <= 3 ? 'low' : ''} ${product.stock === 0 ? 'out' : ''}">
              ${product.stock === 0 ? 'Agotado' : `${product.stock} disponibles`}
            </div>
          </div>
          <div class="product-info">
            <div class="product-header">
              <div class="product-name">
                <h3>${product.name}</h3>
                <p class="product-desc">${product.desc}</p>
              </div>
              <button class="btn-wishlist" onclick="toggleWishlist(event, ${product.id})">&#9825;</button>
            </div>
            <div class="price-tag">$${product.price}</div>
            <div class="features">
              ${product.features.map(f => `<span class="feature">${f}</span>`).join('')}
            </div>
            <div class="product-actions">
              <button class="btn-add-cart" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                ${product.stock === 0 ? 'Agotado' : 'Agregar al Bag'}
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('dots').innerHTML = products.map((_, idx) => `
        <div class="dot ${idx === 0 ? 'active' : ''}" onclick="goToProduct(${idx})"></div>
      `).join('');
    }

    function updateCarousel() {
      document.querySelectorAll('.product-card').forEach((card, idx) => {
        card.classList.remove('active', 'prev');
        if (idx === currentIndex) card.classList.add('active');
        else if (idx < currentIndex) card.classList.add('prev');
      });
      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });
    }

    function nextProduct() { currentIndex = (currentIndex + 1) % products.length; updateCarousel(); }
    function prevProduct() { currentIndex = (currentIndex - 1 + products.length) % products.length; updateCarousel(); }
    function goToProduct(idx) { currentIndex = idx; updateCarousel(); }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product && product.stock > 0) {
        cart.push(product);
        updateCart();
        showToast('\u2713 ' + product.name + ' agregado al bag');
      }
    }

    function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }

    function updateCart() {
      const badge = document.getElementById('cart-badge');
      const itemsContainer = document.getElementById('cart-items');
      const totalPrice = document.getElementById('cart-total');
      badge.textContent = cart.length;

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-secondary)"><p style="font-size:3rem;margin-bottom:15px">\u2728</p><p style="font-size:1.1rem;margin-bottom:20px">Tu colecci\u00f3n est\u00e1 vac\u00eda</p><button onclick="toggleCart()" style="background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer">Explorar piezas</button></div>';
        document.querySelector('.cart-footer').style.display = 'none';
      } else {
        document.querySelector('.cart-footer').style.display = 'block';
        itemsContainer.innerHTML = cart.map((item, idx) => `
          <div class="cart-item">
            <img src="${item.image}" class="cart-item-img" alt="${item.name}">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-price">$${item.price} USD</div>
              <button class="remove-item" onclick="removeFromCart(${idx})">Eliminar</button>
            </div>
          </div>
        `).join('');
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        totalPrice.textContent = '$' + total + ' USD';
      }
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function toggleWishlist(event, productId) {
      event.stopPropagation();
      const btn = event.target;
      btn.classList.toggle('saved');
      const product = products.find(p => p.id === productId);
      const action = btn.classList.contains('saved') ? 'agregado a' : 'removido de';
      showToast('\u2665 ' + product.name + ' ' + action + ' favoritos');
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 2000);
    }

    function scrollToCarousel() {
      document.getElementById('carousel-section').scrollIntoView({ behavior: 'smooth' });
    }

    function sendToWhatsApp() {
      if (cart.length === 0) { showToast('\u26a0\ufe0f Tu bag est\u00e1 vac\u00edo'); return; }
      const itemsList = cart.map(item => '\u2022 ' + item.name + ' ($' + item.price + ')').join('%0A');
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const message = 'Hola MEEX \ud83c\udf38%0A%0AMe gustar\u00eda confirmar mi pedido:%0A%0A' + itemsList + '%0A%0A\ud83d\udcb0 TOTAL: $' + total + ' USD%0A%0A\u00bfPodemos coordinar los detalles de env\u00edo?';
      window.open('https://wa.me/' + WA_NUMBER + '?text=' + message, '_blank');
      showToast('\ud83d\udcf1 Abriendo WhatsApp...');
    }

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 50) { if (diff > 0) nextProduct(); else prevProduct(); }
    });

    initCarousel();
    updateCart();
  </script>
</body>
</html>
